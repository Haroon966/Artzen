# Netlify config for Next.js static export (output: "export")
# Build output is in "out". Headers are set here so X-Robots-Tag is sent on all responses.

[build]
  command = "npm run build"
  publish = "out"

# First match wins: long-cache immutable assets, then HTML + misc short cache.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "index, follow"

[[headers]]
  for = "/cart/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/checkout/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/profile/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/favorites/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
