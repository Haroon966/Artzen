name: Build, publish deploy branch, and deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger-static
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build static export
        run: npm run build

      - name: Publish static build to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: hostinger-deploy
          force_orphan: true
          enable_jekyll: false
          full_commit_message: |
            ci: publish static export for Hostinger

  deploy-to-hostinger:
    runs-on: ubuntu-latest
    needs: build-and-publish
    steps:
      - name: Checkout deploy branch
        uses: actions/checkout@v4
        with:
          ref: hostinger-deploy
          fetch-depth: 1

      - name: Deploy deploy-branch contents to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_FTP_PORT }}
          protocol: ftps
          timeout: 120000
          local-dir: ./
          server-dir: /public_html/
          state-name: .ftp-state-hostinger-deploy-branch.json
          dangerous-clean-slate: true
