name: Build and deploy to Hostinger (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger-static
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build static export
        run: npm run build

      # Upload HTML/JS/CSS and small SVGs only — not raster product/hero/marketing images
      # (serve those from CDN, another host, or sync separately). Re-include paths by editing `exclude`.
      - name: Deploy static export to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_FTP_PORT || '21' }}
          protocol: ftp
          timeout: 120000
          local-dir: ./out/
          server-dir: /public_html/
          state-name: .ftp-state-hostinger-static.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            images/**/*.webp
            images/**/*.jpg
            images/**/*.jpeg
            images/**/*.png
            images/**/*.gif
            images/**/*.avif
            Artzens-logo.png
            Artzens-logo-light.png
            Artzen-favicon.png
            icon.png
